- nombre: listar_productos
  recurso: productos
  metodo: GET
  ruta: /v1/products
  descripcion: Devuelve una lista de los productos o servicios. Los productos se devuelven ordenados por
    fecha de creación, y los productos creados más recientemente aparecen primero.
  lectura: true
  parametros:
  - nombre: code
    en: query
    tipo: string
    obligatorio: false
    descripcion: Representa el código de identificación del producto. Este valor puede ser un código alfanumérico
      que representará el código de identificación del centro de coste.
  - nombre: account_group
    en: query
    tipo: string
    obligatorio: false
    descripcion: Representa el id de la clasificación de inventario
  - nombre: type
    en: query
    tipo: string
    obligatorio: false
    descripcion: Representa el tipo de producto. Este producto puede ser de tipo 'Product', 'Service'
      o 'Consumer Good', por defecto este campo será Product.
  - nombre: stock_control
    en: query
    tipo: string
    obligatorio: false
    descripcion: Representa el control de inventario, por defecto este campo será false.
  - nombre: active
    en: query
    tipo: string
    obligatorio: false
    descripcion: Representa el estado del producto, por defecto este campo será true.
  - nombre: ids
    en: query
    tipo: string
    obligatorio: false
    descripcion: Representa el Id único del producto, este valor debe ser un Guid con el siguiente formato
      00000000-0000-0000-0000-000000000000. Se pueden filtrar hasta 20 id a la vez:https://api.siigo.com/v1/products?ids={GUID},{GUID}
  - nombre: created_start
    en: query
    tipo: string
    obligatorio: false
    descripcion: Formato - date-time (como date-time en RFC3339). Devuelve resultados donde el campo "created"
      es mayor o igual que la fecha ingresada
  - nombre: created_end
    en: query
    tipo: string
    obligatorio: false
    descripcion: Formato - date-time (como date-time en RFC3339). Devuelve resultados donde el campo "created"
      es menor o igual que la fecha ingresada
  - nombre: date_start
    en: query
    tipo: string
    obligatorio: false
    descripcion: Formato - date-time (como date-time en RFC3339). Devuelve resultados con fecha mayor
      o igual que la fecha "date_start"
  - nombre: date_end
    en: query
    tipo: string
    obligatorio: false
    descripcion: Formato - date-time (como date-time en RFC3339). Devuelve resultados con fecha menor
      o igual que la fecha "date_end"
  - nombre: updated_start
    en: query
    tipo: string
    obligatorio: false
    descripcion: Formato - date-time (como date-time en RFC3339). Devuelve resultados donde el campo "last_updated"
      es mayor o igual que la fecha ingresada
  - nombre: updated_end
    en: query
    tipo: string
    obligatorio: false
    descripcion: Formato - date-time (como date-time en RFC3339). Devuelve resultados donde el campo "last_updated"
      es menor o igual que la fecha ingresada
  - nombre: page
    en: query
    tipo: integer
    obligatorio: false
    descripcion: Formato - int32. Representa la página actual
  - nombre: page_size
    en: query
    tipo: integer
    obligatorio: false
    descripcion: Formato - int32. Representa el número de resultados por página.
  doc: 10_productos.md
  fuentes:
  - apiary
  - developers.siigo.com
  codigo_respuesta: 200
  ejemplo_respuesta:
    pagination:
      page: 1
      page_size: 25
      total_results: 253
    results:
