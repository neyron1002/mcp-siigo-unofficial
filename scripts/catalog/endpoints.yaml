# Catálogo de endpoints de Siigo API.
# Generado por scripts/generar_catalogo.py a partir de la documentación oficial (2026-10-15),
# en el MCP anterior del autor (MIT). Desde 2026-11-27 este archivo es la fuente que se edita a mano;
# scripts/build_catalog.py lo convierte en src/mcp_siigo_unofficial/server/catalog.json.
# Una entrada por endpoint; el servidor MCP registra una tool `siigo_<nombre>` por cada una.
version: '2026-10-15'
base_url: https://api.siigo.com
endpoints:
- nombre: generar_token
  recurso: autenticacion
  metodo: POST
  ruta: /auth
  descripcion: Obtendrás un access_token válido por 24 horas, pasado este tiempo, debe ser renovado. Este
    token debe ser enviado en la cabecera de autorización (Authorization) de todas las peticiones al API.
  lectura: false
  parametros: []
  doc: 01_autenticacion.md
  fuentes:
  - apiary
  - developers.siigo.com
  codigo_respuesta: 201
  ejemplo_respuesta:
    access_token: access token
    expires_in: 86400
    token_type: Bearer
    scope: SiigoAPI
  cuerpo:
    type: object
    properties:
      username:
        type: string
        description: Usuario
        example: sandbox@siigoapi.com
      access_key:
        type: string
        description: Access Key
        example: '[access key]'
    required:
    - username
    - access_key
  ejemplo_peticion:
    username: '[email protected]'
    access_key: '1234567890'
  notas:
  - El MCP lo invoca internamente; no se expone como tool porque la respuesta contiene el access_token.
  sensible: true
- nombre: crear_producto
  recurso: productos
  metodo: POST
  ruta: /v1/products
  descripcion: 'Esta funcionalidad te permite crear un producto/servicio, configurando sus características
    como se puede ver en los siguientes campos:'
  lectura: false
  parametros: []
  doc: 10_productos.md
  fuentes:
  - apiary
  - developers.siigo.com
  codigo_respuesta: 201
  ejemplo_respuesta:
    id: 00584089-4ebc-49de-bf75-6a6cc968a96d
    code: Item-1
    name: Camiseta de algodón
    account_group:
      id: 1253
      name: Productos
    type: Product
    stock_control: false
    active: true
    tax_classification: Taxed
    tax_included: false
    tax_consumption_value: 0
    taxes:
    - id: 13156
      name: IVA 19%
      type: IVA
      percentage: 19.0
    prices:
    - currency_code: COP
      price_list:
      - position: 1
        name: Precio de venta 1
        value: 12000
    unit:
      code: '94'
      name: unidad
    unit_label: unidad
    reference: REF1
    description: Camiseta de algodón blanca
    additional_fields:
      barcode: B0123
      brand: Gef
      tariff: '151612'
      model: Loiry
    available_quantity: 0
    warehouses: []
    metadata:
      created: '2020-06-15T03:33:17.208Z'
      last_updated: ''
  cuerpo:
    type: object
    properties:
      code:
        type: string
        description: Código único del producto.
        example: Item-1
      name:
        type: string
        description: Nombre del producto / servicio.
        example: Camiseta de algodón
      account_group:
        type: number
        description: ID de la clasificación de inventario.
        example: 1253
      type:
        type: string
        enum:
        - Product
        - Service
        - ConsumerGood
        description: Tipo de producto, valor por default Product
      stock_control:
        type: boolean
        description: Control de inventario, valor por default false.
        example: false
      active:
        type: boolean
        description: Estado del producto en Siigo, valor por default true.
        example: true
      tax_classification:
        type: string
        enum:
        - Taxed
        - Exempt
        - Excluded
        description: Clasificación tributaria, valor por default Gravado.
      tax_included:
        type: boolean
        description: IVA incluido.
        example: false
      tax_consumption_value:
        type: number
        description: Valor  impuesto al consumo.
        example: 0
      taxes:
        type: array
        items:
          type: object
          properties:
            id:
              type: number
              description: Identificador único del impuesto.
              example: 13156
            milliliters:
              type: number
              description: Número de mililitros del producto.
              example: 1000
            rate:
              type: number
              description: Tarifa del impuesto de bebidas azucaradas.
              example: 35
          required:
          - id
        description: Impuestos que se desean asociar al producto o servicio.
      prices:
        type: array
        items:
          type: object
          properties:
            currency_code:
              type: string
              description: Código de moneda
              example: COP
            price_list:
              type: array
              items:
                type: object
                properties:
                  position:
                    type: number
                    description: Identificador único de la lista de precio.
                    example: 1
                  value:
                    type: number
                    description: Valor de la lista de precio.
                    example: 12000
                required:
                - position
                - value
              description: Lista de precios
          required:
          - currency_code
          - price_list
        description: Son valores de venta que manejan cada uno de los productos o servicios, en  Siigo  es  posible  manejar  hasta
          12 precios de venta.
      unit:
        type: string
        description: Código de la unidad de medida del producto para factura electrónica, valor por default
          94.
        example: '94'
      unit_label:
        type: string
        description: Unidad de medida para impresión factura.
        example: unidad
      reference:
        type: string
        description: Referencia o código de fábrica del producto o servicio.
        example: REF1
      description:
        type: string
        description: Descripción del producto o servicio.
        example: Camiseta de algodón blanca
      additional_fields:
        type: object
        properties:
          barcode:
            type: string
            description: Código de barras.
            example: B0123
          brand:
            type: string
            description: Marca.
            example: Gef
          tariff:
            type: string
            description: Código arancelario.
            example: '151612'
          model:
            type: string
            description: Modelo.
            example: Loiry
        description: 'Campos adicionales como: Código de barras, Marca, Código arancelario, Modelo.'
    required:
    - code
    - name
    - account_group
    - type
  ejemplo_peticion:
    product_id: 63f918c2-ca65-4edc-a7db-66bcdd5159fb
