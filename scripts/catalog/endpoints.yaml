              description: ID del medio de pago.
              example: 5636
            value:
              type: number
              description: Valor asociado al medio de pago.
              example: 1273.03
            due_date:
              type: string
              description: Fecha pago cuota, formato yyyy-MM-dd.
              example: '2021-03-19'
          required:
          - value
