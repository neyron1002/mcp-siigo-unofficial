                required:
                - id
              description: Impuestos que se desean asociar al producto o servicio.
            transport:
              type: object
              properties:
                file_number:
                  type: number
                  description: Número de radicado.
                  example: 536
                shipment_number:
                  type: string
                  description: Número de remesa.
                  example: RM-145
                transported_quantity:
                  type: number
                  description: Cantidad transportada.
                  example: 120
                measurement_unit:
                  type: string
                  description: Unidad de medida.
                  example: KGM
                freight_value:
                  type: number
                  description: Valor del Flete.
                  example: 220000
                purchase_order:
                  type: string
                  description: Orden de compra.
                  example: OC-236
                service_type:
                  type: string
                  description: Tipo de servicio.
                  example: AdditionalService
              description: Campos para empresas de transporte
          required:
          - code
          - quantity
          - price
        description: Productos o Servicios asociados a la factura.
      payments:
        type: array
        items:
          type: object
          properties:
            id:
