      code: Item-1
      name: Camiseta de algodón
      account_group:
        id: 1253
        name: Productos
      type: Product
      stock_control: false
      active: true
      tax_classification: Taxed
      tax_included: false
      tax_consumption_value: 0
      taxes:
      - id: 13156
        name: IVA 19%
        type: IVA
        percentage: 19.0
      prices:
      - currency_code: COP
        price_list:
        - position: 1
          name: Precio de venta 1
          value: 12000
      unit:
        code: '94'
        name: unidad
      unit_label: unidad
      reference: REF1
      description: Camiseta de algodón blanca
      additional_fields:
        barcode: B0123
        brand: Gef
        tariff: '151612'
        model: Loiry
      available_quantity: 0
      warehouses:
      - id: 1270
        name: Bodega principal
        quantity: 1
      metadata:
        created: '2020-06-15T03:33:17.208Z'
