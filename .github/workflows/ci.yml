name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64 (Apple Silicon).
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1
      - name: Install dependencies
        run: uv sync --all-groups --locked
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format
        run: uv run ruff format --check
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Pytest
        # Windows and macOS runners have a real OS keychain (Credential Manager,
        # Keychain); the vault round trip uses it there. Linux uses a temporary
        # Secret Service in the dev container job below.
        env:
          MCP_SIIGO_TEST_REAL_KEYRING: ${{ runner.os != 'Linux' && '1' || '0' }}
          MCP_SIIGO_REQUIRE_QT: "1"
        run: uv run pytest --cov --cov-report=term-missing
      - name: Self-test (Qt, vault, MCP, HTTPS)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python -m mcp_siigo_unofficial --selftest
      - name: Build wheel and sdist
        run: uv build

  devcontainer:
    # CI parity: build the dev container image and run the tests inside it.
    name: tests in dev container
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build the dev container image
        run: docker build -t mcp-siigo-dev -f .devcontainer/Dockerfile .devcontainer
      - name: Run checks inside the image
        # The runner user owns the checkout; run as that user with writable
        # temporary HOME, cache, and virtual environment paths.
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home \
            -e UV_CACHE_DIR=/tmp/uv-cache \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv \
            -e MCP_SIIGO_REQUIRE_QT=1 \
            -v "$PWD:/workspace" -w /workspace \
            mcp-siigo-dev \
            bash -euo pipefail -c '
              uv sync --all-groups --locked
              uv run ruff check
              uv run ruff format --check
              uv run mypy src
              scripts/with-test-keyring.sh uv run pytest -p no:cacheprovider
              xvfb-run -a uv run python -m mcp_siigo_unofficial --selftest
            '
